<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demonstração ao Vivo — Agente de IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #111b21; display: flex; justify-content: center; height: 100dvh; }
    .phone-container { width: 100%; max-width: 480px; background: #efeae2; display: flex; flex-direction: column; height: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.4); }

    /* Cabeçalho estilo WhatsApp */
    .header { background: #075e54; color: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #075e54; }
    .info h1 { font-size: 15px; font-weight: 600; }
    .info p { font-size: 12px; color: #d9fdd3; }

    /* Botão de Conversão para o seu WhatsApp */
    .cta-btn { background: #25d366; color: #075e54; text-decoration: none; font-size: 12px; font-weight: 700; padding: 8px 12px; border-radius: 20px; white-space: nowrap; transition: 0.2s; }
    .cta-btn:hover { background: #20bd5a; }

    /* Área de Mensagens */
    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 9px 13px; border-radius: 8px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    .bot { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; color: #111b21; }
    .user { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; color: #111b21; }
    .typing { font-size: 12px; color: #667781; font-style: italic; display: none; padding-left: 4px; }

    /* Barra de Envio */
    .input-area { background: #f0f2f5; padding: 10px; display: flex; gap: 8px; }
    input { flex: 1; border: none; padding: 12px 16px; border-radius: 24px; font-size: 14px; outline: none; }
    button { background: #075e54; color: white; border: none; padding: 0 18px; border-radius: 24px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="phone-container">
    <div class="header">
      <div class="profile">
        <div class="avatar">IA</div>
        <div class="info">
          <h1>Agente de IA (Demo)</h1>
          <p id="status">online</p>
        </div>
      </div>
      <!-- TROQUE 55SEUNUMERO PELO SEU NÚMERO COM DDD -->
      <a class="cta-btn" href="https://wa.me/5521996519930?text=Oi!%20Testei%20seu%20Agente%20de%20IA%20e%20quero%20colocar%20na%20minha%20empresa." target="_blank">
        Quero no meu WhatsApp
      </a>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">Olá! Eu sou uma demonstração de Agente de IA para WhatsApp. Simule ser um cliente perguntando sobre preços, horários ou tentando agendar um atendimento!</div>
    </div>
    <div class="typing" id="typing">digitando...</div>

    <form class="input-area" id="chatForm">
      <input type="text" id="userInput" placeholder="Digite uma mensagem para testar..." autocomplete="off" required />
      <button type="submit" id="sendBtn">Enviar</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusText = document.getElementById('status');

    let conversationHistory = [];

    function appendMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      conversationHistory.push({ role: 'user', content: text });
      userInput.value = '';
      sendBtn.disabled = true;
      statusText.textContent = 'digitando...';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversationHistory })
        });
        const data = await res.json();
        appendMessage(data.reply, 'bot');
        conversationHistory.push({ role: 'assistant', content: data.reply });
      } catch (err) {
        appendMessage('Erro de conexão. Tente novamente.', 'bot');
      } finally {
        sendBtn.disabled = false;
        statusText.textContent = 'online';
        userInput.focus();
      }
    });
  </script>
</body>
</html>
